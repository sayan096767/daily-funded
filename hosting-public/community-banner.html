<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Community Banner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap">
<style>
/* Layout: one fluid banner (container-query units, no JS scaling) above a small settings strip.
   Single committed dark look: deep green-black ground, green accent, teal rim light on 3D icons. */
:root{
  --bg:#050c0a; --panel:#0c1413; --line:#1c2a27; --fg:#e8f0ee; --mute:#8fa09b; --green:#27f08a;
  --font:'Inter','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);
  padding-block:24px;min-height:100vh;display:flex;align-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{width:100%;max-width:1400px;margin:0 auto}
.page h1.name{margin:0;font-size:15px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.settings label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute);min-width:0}
.settings input{font:inherit;font-size:15px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;min-width:0;width:100%}
.settings input:focus-visible,.copy:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.embed{display:flex;flex-direction:column;gap:10px}
.embed .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.embed .row span{font-size:13px;color:var(--mute);flex:1 1 240px;min-width:0}
.copy{font:inherit;font-weight:600;font-size:14px;color:#04170c;background:var(--green);border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
.embed textarea{width:100%;height:120px;resize:vertical;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
@media (max-width:640px){.settings{grid-template-columns:1fr}}
</style>

<style id="bnCss">
.bn{container-type:inline-size;width:100%}
.bn .cb-card{--u:calc(100cqw / 1600);position:relative;width:100%;aspect-ratio:1600/540;border-radius:calc(38*var(--u));overflow:hidden;font-family:'Inter','Segoe UI',system-ui,sans-serif;
 background:radial-gradient(ellipse at 50% 35%,#16201f 0%,#0d1514 55%,#09100f 100%);
 border:1px solid rgba(40,200,120,.35);box-shadow:0 0 calc(50*var(--u)) rgba(20,200,110,.14),inset 0 0 calc(90*var(--u)) rgba(30,160,120,.10),inset 0 1px 0 rgba(255,255,255,.07)}
.bn .cb-card:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 15% 100%,rgba(30,200,130,.16),transparent 45%),radial-gradient(ellipse at 90% 0%,rgba(30,200,170,.12),transparent 45%);animation:cb-amb 6s ease-in-out infinite}
.bn .cb-card:after{content:"";position:absolute;inset:0;opacity:.2;background-image:radial-gradient(rgba(255,255,255,.35) 1px,transparent 1.2px);background-size:5px 5px;mix-blend-mode:overlay;pointer-events:none}
.bn .cb-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:3;padding-top:calc(6*var(--u))}
.bn h2{margin:0;font-size:calc(66*var(--u));font-weight:300;line-height:1.1;color:#fff;letter-spacing:.015em;text-transform:uppercase}
.bn h2 b{font-weight:700;background:linear-gradient(90deg,#27f08a,#19c9a6);-webkit-background-clip:text;background-clip:text;color:transparent}
.bn p{margin:calc(26*var(--u)) 0 0;font-size:calc(22*var(--u));line-height:1.5;color:#98a4a1}
.bn .cb-btns{margin-top:calc(40*var(--u));display:flex;gap:calc(20*var(--u));align-items:center;flex-wrap:wrap;justify-content:center}
.bn .cb-btn{position:relative;overflow:hidden;display:flex;align-items:center;gap:calc(12*var(--u));height:calc(62*var(--u));padding:0 calc(34*var(--u));border-radius:calc(16*var(--u));font-size:calc(21*var(--u));font-weight:700;text-decoration:none;white-space:nowrap}
.bn .cb-btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.bn .cb-g{color:#04170c;background:linear-gradient(180deg,#37f598,#00d765);box-shadow:0 0 0 calc(7*var(--u)) rgba(10,60,35,.9),0 0 0 calc(8*var(--u)) rgba(40,255,140,.4),0 0 calc(40*var(--u)) rgba(0,230,120,.45),inset 0 2px 0 rgba(255,255,255,.55);animation:cb-pulse 3s ease-in-out infinite}
.bn .cb-d{color:#fff;background:linear-gradient(180deg,#303737,#202727);box-shadow:0 0 0 calc(7*var(--u)) rgba(255,255,255,.05),0 calc(8*var(--u)) calc(22*var(--u)) rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14)}
.bn .cb-tri{width:0;height:0;border-left:calc(11*var(--u)) solid currentColor;border-top:calc(7*var(--u)) solid transparent;border-bottom:calc(7*var(--u)) solid transparent}
.bn .cb-btn i{position:absolute;top:0;bottom:0;left:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:cb-sweep 3s ease-in-out infinite;pointer-events:none}
.bn .cb-d i{animation-delay:-1.5s;opacity:.45}
.bn .cb-btn:hover{filter:brightness(1.12)}
.bn .cb-ic{position:absolute;z-index:2;filter:drop-shadow(0 calc(30*var(--u)) calc(24*var(--u)) rgba(0,0,0,.7))}
.bn .cb-ic svg{width:100%;height:100%;overflow:visible;display:block}
.bn .cb-l{left:calc(62*var(--u));bottom:calc(34*var(--u));width:calc(230*var(--u));height:calc(230*var(--u));animation:cb-f1 6s ease-in-out infinite}
.bn .cb-r{right:calc(62*var(--u));top:calc(30*var(--u));width:calc(200*var(--u));height:calc(200*var(--u));animation:cb-f2 6s ease-in-out infinite}
.bn .cb-img{position:relative;width:100%;height:100%;border-radius:22.5%;background-size:cover;background-position:center;
 box-shadow:calc(-2*var(--u)) calc(2*var(--u)) 0 #2a3331,calc(-4*var(--u)) calc(4*var(--u)) 0 #151b1a,calc(-6*var(--u)) calc(6*var(--u)) 0 #0d1110,calc(-9*var(--u)) calc(9*var(--u)) 0 #050707,calc(-12*var(--u)) calc(12*var(--u)) 0 #030404,0 0 0 calc(2*var(--u)) rgba(42,240,208,.55)}
.bn .cb-img:after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.08) 42%,rgba(255,255,255,0) 52%,rgba(0,0,0,.28) 100%)}
.bn .cb-r{filter:drop-shadow(0 calc(30*var(--u)) calc(24*var(--u)) rgba(0,0,0,.7)) drop-shadow(0 0 calc(30*var(--u)) rgba(255,40,140,.35))}
.bn .cb-dc{display:block;width:100%;height:auto}
.bn .cb-l{height:auto;filter:drop-shadow(0 calc(30*var(--u)) calc(24*var(--u)) rgba(0,0,0,.7)) drop-shadow(0 0 calc(30*var(--u)) rgba(88,101,242,.4))}
@keyframes cb-amb{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes cb-sweep{0%{transform:translateX(-200%) skewX(-20deg)}55%,100%{transform:translateX(500%) skewX(-20deg)}}
@keyframes cb-pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}
@keyframes cb-f1{0%,100%{transform:translateY(0) rotate(-12deg)}50%{transform:translateY(calc(-18*var(--u))) rotate(-6deg)}}
@keyframes cb-f2{0%,100%{transform:translateY(0) rotate(14deg)}50%{transform:translateY(calc(16*var(--u))) rotate(8deg)}}
/* narrow containers: stack content, keep text readable */
@container (max-width:760px){
 .bn .cb-card{aspect-ratio:auto}
 .bn .cb-center{position:relative;inset:auto;padding:96px 20px 110px}
 .bn h2{font-size:clamp(24px,7.4cqw,44px)}
 .bn p{font-size:clamp(14px,3.2cqw,18px);margin-top:16px}
 .bn .cb-btns{margin-top:24px;gap:16px}
 .bn .cb-btn{height:50px;padding:0 22px;font-size:15px;border-radius:12px;gap:10px}
 .bn .cb-g,.bn .cb-d{box-shadow:0 0 0 4px rgba(255,255,255,.06),0 0 24px rgba(0,230,120,.25)}
 .bn .cb-tri{border-left-width:8px;border-top-width:5px;border-bottom-width:5px}
 .bn .cb-l{width:92px;height:auto;left:10px;bottom:6px}
 .bn .cb-r{width:84px;height:84px;right:12px;top:10px}
 .bn .cb-card:before{animation:none}
}
@media (prefers-reduced-motion:reduce){.bn *,.bn .cb-card:before{animation:none!important}}
</style>
