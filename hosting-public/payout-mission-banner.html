<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your mission to a payout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#02030a;--ink:#f2f5ff;--mute:#97a3c4;--accent:#35f2b0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;z-index:2;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto;padding:clamp(14px,3vw,34px);gap:14px;pointer-events:none}
.ui>*{pointer-events:auto}
.cta{grid-column:2;grid-row:1;justify-self:end;padding:12px 22px;border-radius:10px;background:var(--accent);color:#02030a;font:600 14px Inter,sans-serif;text-decoration:none;box-shadow:0 0 40px -8px var(--accent)}
.stage{grid-column:1;grid-row:2;align-self:center;max-width:430px;transition:opacity .3s,transform .45s}
.stage.swap{opacity:0;transform:translateX(-14px)}
.count{font:500 13px Inter,sans-serif;color:var(--accent);margin-bottom:12px}
h2{font:700 clamp(28px,4.6vw,56px)/1.08 Unbounded,sans-serif;margin:0 0 14px;letter-spacing:-.02em;text-shadow:0 4px 30px rgba(0,0,0,.8)}
.stage p{margin:0;color:var(--mute);font-size:17px;line-height:1.55;max-width:24em;text-shadow:0 2px 16px #000}
.line{grid-column:2;grid-row:2;align-self:center;display:flex;flex-direction:column;position:relative;padding-left:2px}
.line::before{content:"";position:absolute;left:18px;top:20px;bottom:20px;width:2px;background:rgba(255,255,255,.18)}
.step{position:relative;display:flex;align-items:center;gap:12px;background:transparent;border:0;color:var(--mute);font:500 14px Inter,sans-serif;padding:8px 6px;cursor:pointer;text-align:left;transition:.3s}
.step i{font:700 11px Unbounded,sans-serif;font-style:normal;width:26px;height:26px;border-radius:50%;background:#02030a;border:2px solid rgba(255,255,255,.35);display:grid;place-items:center;flex:none}
.step.on{color:#fff}
.step.on i{border-color:var(--accent);background:var(--accent);color:#02030a;box-shadow:0 0 22px var(--accent)}
.step.done i{border-color:var(--accent);color:var(--accent)}
.foot{grid-column:1/3;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
nav{display:flex;gap:6px}
.tab{font:600 14px Inter,sans-serif;color:var(--ink);background:rgba(10,14,30,.7);border:1px solid rgba(255,255,255,.22);padding:11px 20px;border-radius:10px;cursor:pointer;transition:.3s}
.tab[aria-pressed=true]{background:var(--tc);border-color:var(--tc);color:#02030a}
.cta:focus-visible,.tab:focus-visible,.step:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media(max-width:700px){.step span{display:none}.line::before{display:none}.line{flex-direction:row;grid-column:1/3;grid-row:3;justify-self:center;align-self:end}.stage{grid-column:1/3;align-self:end}.ui{grid-template-rows:auto 1fr auto auto}.foot{grid-row:4}.stage p{font-size:14px}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="ui">
  <a class="cta" id="cta" href="#pricing" target="_parent"></a>
  <div class="stage" id="stage" aria-live="polite"><div class="count" id="count"></div><h2 id="sTitle"></h2><p id="sDesc"></p></div>
  <div class="line" id="steps"></div>
  <div class="foot"><nav id="nav" aria-label="Account types"></nav></div>
</div>

const labels=[];

{const p=P(TIERS[0],0);cam.position.set(p.x,p.y+10,p.z+80);look.copy(p);}

}catch(err){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:9;display:grid;place-items:center;padding:24px;color:#fff;font:16px sans-serif;text-align:center';d.textContent='The 3D scene could not start: '+err.message;document.body.appendChild(d);}})();
